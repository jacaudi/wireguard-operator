name: PR pipeline
on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "images/**"
      - "config/**"
      - ".github/workflows/pull-request-workflow.yaml"

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # REQUIRED BY THE RATCHET, and its absence fails OPEN rather than loud.
          # .golangci.yml sets `new-from-merge-base: origin/main`, which needs the
          # merge base to exist locally. At the default depth of 1 it does not,
          # and golangci-lint downgrades that to a warning —
          #   "Can't process results by diff processor: ... could not read git repo"
          # — then reports the FULL tree: 113 pre-existing findings, and a red
          # gate that says nothing about the change under review.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run tests
        run: make test-ci

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit tests
          path: test-report.json
          reporter: golang-json

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build images
        env:
          MANAGER_IMAGE: wireguard-operator/manager:test
          AGENT_IMAGE: wireguard-operator/agent:test
        run: |
          make docker-build-integration-test

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: azure/setup-kubectl@v5

      - name: Run e2e tests
        run: |
          make kind
          make run-e2e AGENT_IMAGE=wireguard-operator/agent:test MANAGER_IMAGE=wireguard-operator/manager:test
