# Orchestrator — local reusable stages, PR-gated image builds, one required check `ci`.
name: CI

# push only, no pull_request — branch-push checks surface on the PR anyway, and
# adding pull_request would double-run every same-repo PR.
#
# The release stage wants APP secrets. GITHUB_TOKEN cannot trigger workflows, so
# without them release-please's own release PR gets no run, `ci` never reports,
# and that PR is unmergeable under branch protection.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Does not cancel a RUNNING main job. A third main push can still cancel the
  # one sitting pending — GitHub allows only one pending run per group.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Decides whether this push warrants pushing images. Lint and test always run;
  # publishing does not — most feature-branch commits are WIP, and a multi-arch
  # build of two images is the bulk of the runner time and registry churn.
  # A DRAFT PR counts.
  context:
    name: context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.q.outputs.build }}
    steps:
      - id: q
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "main or manual dispatch -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" \
                --state open --json number --jq 'length')
          if [ "${n}" -gt 0 ]; then
            echo "${n} open PR(s) for ${GITHUB_REF_NAME} -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "no open PR for ${GITHUB_REF_NAME} -> lint/test only (open a draft PR to get images)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    uses: ./.github/workflows/ci-lint.yml

  test:
    uses: ./.github/workflows/ci-test.yml

  e2e:
    needs: [test]
    uses: ./.github/workflows/ci-e2e.yml

  build:
    needs: [context, lint, test]
    if: ${{ needs.context.outputs.build == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build.yml

  release:
    needs: [e2e, build]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    uses: ./.github/workflows/ci-release.yml

  # Builds from the TAG rather than this run's commit, so the published images
  # are the released tree even if main moved on mid-run.
  release-image:
    needs: [release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build.yml
    with:
      version: ${{ needs.release.outputs.tag_name }}
      ref: ${{ needs.release.outputs.tag_name }}

  # Needs the images to exist first: the manifest pins them by tag, and shipping
  # an install file that references an image nobody pushed is worse than no file.
  release-artifact:
    needs: [release, release-image]
    permissions:
      contents: write
    uses: ./.github/workflows/ci-artifact.yml
    with:
      version: ${{ needs.release.outputs.tag_name }}

  # THE single required status check — point every ruleset at `ci` and nothing else.
  ci:
    # `context` MUST be here. Without it, a failing context skips build, this
    # gate accepts `skipped`, and the required check goes GREEN on a PR whose
    # images were never built.
    needs: [context, lint, test, e2e, build]
    if: ${{ !cancelled() }}   # required: else this is SKIPPED on failure, which can satisfy protection
    runs-on: ubuntu-latest
    steps:
      - name: Assert required stages
        env:
          CONTEXT: ${{ needs.context.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          fail=0
          for stage in context:"${CONTEXT}" lint:"${LINT}" test:"${TEST}" e2e:"${E2E}"; do
            name="${stage%%:*}"; result="${stage##*:}"
            printf '%-8s %s (must be success)\n' "${name}" "${result}"
            [ "${result}" = "success" ] || fail=1
          done
          # build skips legitimately when context says "no open PR" — and context
          # is asserted successful above, so a skip here is a real decision
          # rather than an upstream failure leaking through.
          printf '%-8s %s (success, or skipped when no PR is open)\n' build "${BUILD}"
          case "${BUILD}" in success|skipped) ;; *) fail=1 ;; esac
          [ "${fail}" = "0" ] || { echo "::error::one or more required stages did not pass"; exit 1; }
